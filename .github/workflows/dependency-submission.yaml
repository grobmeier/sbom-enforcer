name: Dependency Submission

on:
  push:
    branches:
      - "main"

permissions: { }

jobs:
  submit-dependencies:
    name: Submit Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # 6.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Submit Dependency Graph
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # 6.0.1
